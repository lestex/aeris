# AerisOS — minimal Hyprland config.
#
# Only long-stable config keys are used here. Hyprland raises an error
# overlay for options it does not recognise, and the blur/shadow blocks have
# been renamed more than once, so they are left out rather than guessed at.
#
# Effects are off on purpose: in the VM there is no virgl, so rendering falls
# to llvmpipe on the CPU. Turn them on once you are on real hardware.

monitor = , preferred, auto, 1

$mod      = SUPER
# kitty, not foot, because it is the only one of the four terminals whose
# reload path is both documented and drivable from outside: aeris-theme sends
# it SIGUSR1 and the colours change in place. alacritty reloads itself
# (live_config_reload). foot and ghostty cannot reload at all — a theme switch
# only reaches a window opened after it.
$terminal = kitty

# Alternate modifier. In a QEMU window on macOS the Command key — which maps
# to SUPER — is often swallowed by the host before the guest sees it, which
# leaves no way to open a terminal. ALT always passes through, so the handful
# of bindings you need to get moving are mirrored onto it below.
$alt      = ALT

input {
  kb_layout    = us
  follow_mouse = 1

  touchpad {
    natural_scroll = true
  }
}

general {
  gaps_in     = 4
  gaps_out    = 8
  border_size = 2
  layout      = dwindle

  col.active_border   = rgba(2b5b8cff)
  col.inactive_border = rgba(44505faa)
}

decoration {
  rounding = 6
}

dwindle {
  # Without this, "layoutmsg togglesplit" is accepted but does nothing.
  preserve_split = true
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo     = true
  disable_splash_rendering  = true
}

# --- autostart --------------------------------------------------------------
exec-once = hyprpolkitagent

# Quickshell. The Fedora package ships both /usr/bin/qs and /usr/bin/quickshell.
exec-once = qs

# --- bindings ---------------------------------------------------------------
# Launcher and menus. SPACE is the app launcher; M is the aeris menu, which
# is fuzzel in dmenu mode over a shell script.
bind = $mod, SPACE, exec, fuzzel
bind = $alt, SPACE, exec, fuzzel
bind = $mod, M, exec, aeris-menu
bind = $alt, M, exec, aeris-menu

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit

# Same three on ALT, for when SUPER is unavailable (see $alt above).
bind = $alt, Return, exec, $terminal
bind = $alt, Q, killactive
bind = $alt SHIFT, E, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit   # a layout message since 0.54, not a dispatcher

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot region to clipboard
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# --- theme ------------------------------------------------------------------
# Generated by `aeris-theme set <name>`. Sourced last so its colours win over
# the defaults above. Missing before the first run, and Hyprland treats an
# absent source as fatal, so aeris-theme is run once by setup.d/70-theme.sh.
source = ~/.local/state/aerisos/current/hyprland.conf
