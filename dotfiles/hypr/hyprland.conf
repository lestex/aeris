# AerisOS — minimal Hyprland config.
#
# Only long-stable config keys are used here. Hyprland raises an error
# overlay for options it does not recognise, and the blur/shadow blocks have
# been renamed more than once, so they are left out rather than guessed at.
#
# Effects are off on purpose: in the VM there is no virgl, so rendering falls
# to llvmpipe on the CPU. Turn them on once you are on real hardware.

monitor = , preferred, auto, 1

$mod      = SUPER
$terminal = foot

input {
  kb_layout    = us
  follow_mouse = 1

  touchpad {
    natural_scroll = true
  }
}

general {
  gaps_in     = 4
  gaps_out    = 8
  border_size = 2
  layout      = dwindle

  col.active_border   = rgba(2b5b8cff)
  col.inactive_border = rgba(44505faa)
}

decoration {
  rounding = 6
}

dwindle {
  # Without this, "layoutmsg togglesplit" is accepted but does nothing.
  preserve_split = true
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo     = true
  disable_splash_rendering  = true
}

# --- autostart --------------------------------------------------------------
exec-once = hyprpolkitagent

# Quickshell. Upstream installs the binary as `quickshell`; some packages also
# ship a `qs` alias, so take whichever exists rather than assuming.
exec-once = sh -c 'command -v qs >/dev/null && exec qs || exec quickshell'

# --- bindings ---------------------------------------------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit   # a layout message since 0.54, not a dispatcher

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot region to clipboard
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
